# Publish the Cyphra VS Code extension (packages/vscode) to the Visual Studio Marketplace and/or
# Open VSX. Manual only (Actions tab > "Publish VS Code extension" > Run workflow).
#
# Repository secrets (Settings > Secrets and variables > Actions):
# - VSCE_PAT: Azure DevOps personal access token with the "Marketplace > Manage" scope, for the
#   publisher named in packages/vscode/package.json ("publisher").
# - OVSX_PAT: Open VSX access token (open-vsx.org > Settings > Access Tokens), for the namespace
#   of the same name.
# A target whose secret is missing is skipped with a warning. See CONTRIBUTING.md
# ("VS Code extension").
name: Publish VS Code extension

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [both, marketplace, open-vsx]
        default: both

permissions:
  contents: read

concurrency:
  group: vscode-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' run build

      - name: Test the language server and the extension
        run: pnpm exec vitest run --project @cyphra/language-server --project cyphra-vscode

      - name: Package
        run: pnpm --filter cyphra-vscode run package

      - name: Upload the published .vsix
        uses: actions/upload-artifact@v4
        with:
          name: cyphra-vscode-vsix
          path: packages/vscode/cyphra-vscode.vsix
          if-no-files-found: error

      - name: Publish to the Visual Studio Marketplace
        if: inputs.target != 'open-vsx'
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set: skipping the Visual Studio Marketplace."
            exit 0
          fi
          pnpm exec vsce publish --no-dependencies --packagePath cyphra-vscode.vsix

      - name: Publish to Open VSX
        if: inputs.target != 'marketplace'
        working-directory: packages/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set: skipping Open VSX."
            exit 0
          fi
          pnpm dlx ovsx@1.3.0 publish cyphra-vscode.vsix --pat "$OVSX_PAT"
