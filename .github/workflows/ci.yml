name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' run build

      # Bins of workspace packages (e.g. `cyphra` for examples/blog) only link once dist/ exists.
      - name: Link workspace binaries
        run: pnpm install --frozen-lockfile --offline

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit (high+)
        run: pnpm audit --audit-level=high

      - name: Test
        run: pnpm test

      # The VS Code extension as a .vsix (bundled language server included), downloadable from the
      # run's artifacts. Publishing is manual: .github/workflows/vscode-publish.yml.
      - name: Package VS Code extension
        run: pnpm --filter cyphra-vscode run package

      - name: Upload VS Code extension
        uses: actions/upload-artifact@v4
        with:
          name: cyphra-vscode-vsix
          path: packages/vscode/cyphra-vscode.vsix
          if-no-files-found: error

      - name: Example app (smoke)
        run: pnpm example:basic

      # Unit tests of examples/graphrag (its Neo4j test runs in neo4j-integration).
      - name: Example GraphRAG (unit tests)
        run: pnpm --filter cyphra-example-graphrag --fail-if-no-match test

      # examples/trpc-nextjs: error mapping through the fetch handler (its Neo4j tests run in
      # neo4j-integration), then a production build of the Next.js app.
      - name: Example tRPC + Next.js (unit tests, build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm --filter cyphra-example-trpc-nextjs --fail-if-no-match test
          pnpm --filter cyphra-example-trpc-nextjs --fail-if-no-match build

      # examples/nestjs: production build with tsc (its e2e tests run in neo4j-integration).
      - name: Example NestJS (build)
        run: pnpm --filter cyphra-example-nestjs --fail-if-no-match build

      - name: Lint docs content (blog, glossary)
        run: pnpm --filter cyphra-doc lint:content

      - name: Build docs
        run: pnpm doc:build

      # Serve the built docs and check titles, canonicals, JSON-LD, links, sitemap, feed and
      # security.txt (doc/scripts/seo-audit.ts).
      - name: SEO audit
        run: |
          pnpm --filter cyphra-doc exec next start -p 3100 > next-start.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3100/sitemap.xml && break; sleep 1; done
          pnpm --filter cyphra-doc seo:audit http://localhost:3100

  neo4j-integration:
    name: neo4j-integration (neo4j-driver ${{ matrix.neo4j-driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported range: ^5.28.3 || ^6.0.0 (peer dependency of @cyphra/runtime and friends).
        # "5" uses the lockfile as is; "6" overrides every neo4j-driver in the workspace.
        neo4j-driver: ["5", "6"]
    services:
      neo4j:
        image: neo4j:5-community
        ports:
          - 7687:7687
          # Query API (HTTP transport). Enabled by default on Neo4j 5.19+.
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/cyphra_ci_test
          # @neo4j/graphql (compat/graphql reference) needs APOC: apoc.util.validate(Predicate)
          # for authorization and cardinality checks in nested mutations.
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "cypher-shell -u neo4j -p cyphra_ci_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 60s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The aliased neo4j-driver-5 / neo4j-driver-6 dev dependencies of @cyphra/runtime are not
      # affected, so the cross-major (user driver != Cyphra's driver) tests run in both legs.
      - name: Use neo4j-driver 6
        if: matrix.neo4j-driver == '6'
        run: |
          npm pkg set 'pnpm.overrides.neo4j-driver=^6.3.2'
          pnpm install --no-frozen-lockfile
          git checkout -- package.json pnpm-lock.yaml

      - name: Show resolved neo4j-driver
        run: pnpm --filter @cyphra/runtime exec node -p "'neo4j-driver ' + require('neo4j-driver/package.json').version"

      - name: Build packages
        run: pnpm -r --filter './packages/*' run build

      - name: Typecheck against the resolved driver
        if: matrix.neo4j-driver == '6'
        run: pnpm -r --filter './packages/*' run typecheck

      - name: Neo4j integration tests
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: |
          pnpm --filter @cyphra/runtime --fail-if-no-match exec vitest run src/client.integration.test.ts src/orm/orm.integration.test.ts src/orm/onDelete.integration.test.ts src/orm/rules.integration.test.ts src/orm/interfaces.integration.test.ts src/orm/labels.integration.test.ts src/orm/unions.integration.test.ts src/orm/unionSearch.integration.test.ts src/orm/paging.integration.test.ts src/orm/nestedWrites.integration.test.ts src/driver-compat.integration.test.ts
          pnpm --filter @cyphra/migrator --fail-if-no-match exec vitest run src/push.integration.test.ts src/migrate.integration.test.ts src/drift.integration.test.ts
          # Better Auth conformance suites + adapter, typed-client and migration tests.
          pnpm --filter @cyphra/better-auth --fail-if-no-match exec vitest run test/
          # @cyphra/graphql mutations (counters, nested writes, rollback, concurrent connect),
          # adversarial authorization tests (tokens, nested reads, aggregates, rolled-back writes)
          # @cypher / @fulltext (aggregating statements, injection attempts through arguments) and the
          # native API (paging, fragments, _edge, limits; only Ng* nodes; mutations, only Nw* nodes).
          pnpm --filter @cyphra/graphql --fail-if-no-match exec vitest run test/mutations.integration.test.ts test/auth.integration.test.ts test/cypher.integration.test.ts test/native.integration.test.ts test/native.writes.integration.test.ts test/native.auth.integration.test.ts test/native.reads.integration.test.ts
          # @cyphra/nestjs: @Transactional() commit/rollback across services, health check, shutdown.
          pnpm --filter @cyphra/nestjs --fail-if-no-match exec vitest run test/nestjs.integration.test.ts
          # @cyphra/testing: schema, migrations, wipe, rollback and factories (only Tst* nodes).
          pnpm --filter @cyphra/testing --fail-if-no-match exec vitest run test/database.integration.test.ts
          # `cyphra studio` API through the ORM (own Sd* labels: safe alongside the other suites), and
          # `cyphra import graphql --url` (own ImpX labels, its constraints dropped at the end).
          pnpm --filter @cyphra/cli --fail-if-no-match exec vitest run src/studio/studio.integration.test.ts src/studio/studio.unions.integration.test.ts src/commands/importGraphql.integration.test.ts
          # `cyphra migrate reset` empties the whole database, so it runs on its own (opt-in flag).
          CYPHRA_TEST_RESET_DB=1 pnpm --filter @cyphra/cli --fail-if-no-match exec vitest run src/commands/migrateReset.integration.test.ts
          # `cyphra migrate status` compares the whole database with the migrations: same opt-in flag.
          CYPHRA_TEST_RESET_DB=1 pnpm --filter @cyphra/cli --fail-if-no-match exec vitest run src/commands/migrateStatus.integration.test.ts

      # @cyphra/testing's startDatabase(): Neo4j, Memgraph and FalkorDB containers started with
      # Testcontainers (Docker is available on the runner). Images do not depend on the driver leg.
      - name: Testcontainers (@cyphra/testing)
        if: matrix.neo4j-driver == '5'
        env:
          CYPHRA_TEST_CONTAINERS: neo4j,memgraph,falkordb
        run: pnpm --filter @cyphra/testing --fail-if-no-match exec vitest run test/container.integration.test.ts

      # The same ORM suite over the HTTP transport (Neo4j Query API, what edge runtimes use), plus
      # the transport's own tests (typed values through the server, explicit transactions, error
      # codes). HTTP does not go through neo4j-driver, so it runs once.
      - name: Neo4j integration tests (HTTP transport)
        if: matrix.neo4j-driver == '5'
        env:
          NEO4J_TEST_URI: http://127.0.0.1:7474
          NEO4J_TEST_HTTP_URI: http://127.0.0.1:7474
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: pnpm --filter @cyphra/runtime --fail-if-no-match exec vitest run src/client.integration.test.ts src/orm/orm.integration.test.ts src/orm/interfaces.integration.test.ts src/orm/labels.integration.test.ts src/orm/unions.integration.test.ts src/orm/unionSearch.integration.test.ts src/orm/paging.integration.test.ts src/orm/nestedWrites.integration.test.ts src/http/http.integration.test.ts

      # examples/graphrag: ingest the sample documents and check hybrid retrieval and graph
      # expansion. Its `cyphra generate` needs the workspace bins, linked once dist/ exists.
      - name: Example GraphRAG (Neo4j)
        if: matrix.neo4j-driver == '5'
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: |
          pnpm install --frozen-lockfile --offline
          pnpm --filter cyphra-example-graphrag --fail-if-no-match test

      # examples/trpc-nextjs: every procedure of the router through createCaller, plus Dates over
      # HTTP with superjson.
      - name: Example tRPC + Next.js (Neo4j)
        if: matrix.neo4j-driver == '5'
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: pnpm --filter cyphra-example-trpc-nextjs --fail-if-no-match test

      # examples/nestjs: the HTTP API end to end (transfers in @Transactional(), rollback, health).
      - name: Example NestJS (Neo4j)
        if: matrix.neo4j-driver == '5'
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: |
          pnpm install --frozen-lockfile --offline
          pnpm --filter cyphra-example-nestjs --fail-if-no-match test

      # @neo4j/graphql v7 compatibility suite: goldens must still match (compat/graphql). It does
      # not exercise Cyphra's driver handling, so it runs once.
      - name: GraphQL compatibility suite
        if: matrix.neo4j-driver == '5'
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: pnpm --filter compat-graphql --fail-if-no-match test

      # Benchmarks (bench/): a quick smoke run (small data set, a few iterations) so the scripts
      # and every contender keep working. The full run is manual (`pnpm bench`, bench/README.md):
      # CI machines are too noisy to publish numbers from. It wipes its own labels, so it runs last.
      - name: Benchmarks (smoke)
        if: matrix.neo4j-driver == '5'
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_HTTP_URI: http://127.0.0.1:7474
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: |
          pnpm install --frozen-lockfile --offline
          pnpm bench --quick

  # GraphQL subscriptions (@cyphra/graphql) need Neo4j Change Data Capture, an Enterprise feature:
  # the only job on Neo4j Enterprise (evaluation license), everything else stays on Community. It runs
  # the subscription fixtures of the compat suite (events compared with goldens from @neo4j/graphql)
  # and @cyphra/graphql's subscription integration tests.
  neo4j-enterprise-cdc:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-enterprise
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/cyphra_ci_test
          NEO4J_ACCEPT_LICENSE_AGREEMENT: eval
          # @neo4j/graphql (compat reference) needs APOC, as in neo4j-integration.
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "cypher-shell -u neo4j -p cyphra_ci_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 60s
          --health-retries 12
    env:
      NEO4J_TEST_URI: bolt://127.0.0.1:7687
      NEO4J_TEST_USER: neo4j
      NEO4J_TEST_PASSWORD: cyphra_ci_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' run build

      - name: Enable CDC
        run: |
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p cyphra_ci_test -d system \
            "ALTER DATABASE neo4j SET OPTION txLogEnrichment 'FULL' WAIT"
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p cyphra_ci_test 'CALL db.cdc.current()'

      - name: GraphQL subscriptions (compat suite and integration tests)
        env:
          NEO4J_TEST_CDC: "1"
        run: |
          COMPAT_FIXTURES=subscriptions,subscriptions-schema pnpm --filter compat-graphql --fail-if-no-match test
          pnpm --filter @cyphra/graphql --fail-if-no-match exec vitest run test/subscriptions.integration.test.ts

  # @cyphra/nestjs is developed against NestJS 12; its peer range also covers 10 and 11. Unit tests
  # (module, @Transactional(), Terminus health check) and a typecheck against each older major.
  nestjs-compat:
    name: nestjs-compat (NestJS ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: ["10", "11"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Use NestJS ${{ matrix.nest }}
        run: |
          for p in common core testing platform-express terminus; do
            npm pkg set "pnpm.overrides.@nestjs/$p=^${{ matrix.nest }}.0.0"
          done
          pnpm install --no-frozen-lockfile
          git checkout -- package.json pnpm-lock.yaml

      - name: Show resolved NestJS
        run: pnpm --filter @cyphra/nestjs exec node -p "'@nestjs/core ' + require('@nestjs/core/package.json').version + ', @nestjs/terminus ' + require('@nestjs/terminus/package.json').version"

      - name: Build dependencies
        run: pnpm --filter '@cyphra/nestjs^...' run build

      - name: Typecheck and unit tests
        run: |
          pnpm --filter @cyphra/nestjs --fail-if-no-match run typecheck
          pnpm --filter @cyphra/nestjs --fail-if-no-match exec vitest run test/module.test.ts test/health-terminus10.test.ts test/types.test.ts

  # The ORM, migrator and CLI suites on Memgraph (dialect "memgraph"): the shared ORM suites skip or
  # adapt what Memgraph does not support (see doc/app/memgraph/page.mdx), plus Memgraph-only tests.
  memgraph-integration:
    runs-on: ubuntu-latest
    services:
      memgraph:
        # Pinned: the feature matrix in the docs is verified against this version.
        image: memgraph/memgraph:3.14.0
        ports:
          - 7687:7687
    env:
      CYPHRA_TEST_DIALECT: memgraph
      NEO4J_TEST_URI: bolt://127.0.0.1:7687
      # Memgraph accepts any credentials while authentication is off.
      NEO4J_TEST_USER: memgraph
      NEO4J_TEST_PASSWORD: memgraph
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' run build

      - name: Wait for Memgraph
        run: |
          for i in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/7687) 2>/dev/null && exit 0
            sleep 1
          done
          echo "Memgraph did not start" >&2
          exit 1

      - name: Memgraph integration tests
        run: |
          pnpm --filter @cyphra/runtime --fail-if-no-match exec vitest run src/client.integration.test.ts src/orm/orm.integration.test.ts src/orm/onDelete.integration.test.ts src/orm/rules.integration.test.ts src/orm/interfaces.integration.test.ts src/orm/labels.integration.test.ts src/orm/unions.integration.test.ts src/orm/unionSearch.integration.test.ts src/orm/paging.integration.test.ts src/orm/nestedWrites.integration.test.ts src/orm/memgraph.integration.test.ts
          pnpm --filter @cyphra/migrator --fail-if-no-match exec vitest run src/memgraph.integration.test.ts
          pnpm --filter @cyphra/testing --fail-if-no-match exec vitest run test/database.integration.test.ts
          pnpm --filter @cyphra/cli --fail-if-no-match exec vitest run src/studio/studio.memgraph.integration.test.ts src/studio/studio.unions.integration.test.ts
          # `cyphra migrate reset` empties the whole database, so it runs on its own (opt-in flag).
          CYPHRA_TEST_RESET_DB=1 pnpm --filter @cyphra/cli --fail-if-no-match exec vitest run src/commands/migrateReset.memgraph.integration.test.ts

  # The ORM, migrator and CLI suites on FalkorDB (dialect "falkordb", the Redis-protocol transport):
  # the shared ORM suites skip or adapt what FalkorDB does not support (see
  # doc/app/falkordb/page.mdx), plus FalkorDB-only tests. Each suite uses its own graph.
  falkordb-integration:
    runs-on: ubuntu-latest
    services:
      falkordb:
        # Pinned: the feature matrix in the docs is verified against this version.
        image: falkordb/falkordb:v4.22.3
        ports:
          - 6379:6379
    env:
      CYPHRA_TEST_DIALECT: falkordb
      FALKORDB_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' run build

      - name: Wait for FalkorDB
        run: |
          for i in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null && exit 0
            sleep 1
          done
          echo "FalkorDB did not start" >&2
          exit 1

      - name: FalkorDB integration tests
        run: |
          pnpm --filter @cyphra/runtime --fail-if-no-match exec vitest run src/client.integration.test.ts src/orm/orm.integration.test.ts src/orm/onDelete.integration.test.ts src/orm/rules.integration.test.ts src/orm/interfaces.integration.test.ts src/orm/labels.integration.test.ts src/orm/unions.integration.test.ts src/orm/unionSearch.integration.test.ts src/orm/paging.integration.test.ts src/orm/nestedWrites.integration.test.ts src/orm/falkordb.integration.test.ts
          pnpm --filter @cyphra/migrator --fail-if-no-match exec vitest run src/falkordb.integration.test.ts
          pnpm --filter @cyphra/testing --fail-if-no-match exec vitest run test/database.integration.test.ts
          pnpm --filter @cyphra/cli --fail-if-no-match exec vitest run src/commands/migrateReset.falkordb.integration.test.ts src/studio/studio.falkordb.integration.test.ts src/studio/studio.unions.integration.test.ts
