name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' run build

      # Bins of workspace packages (e.g. `cyphra` for examples/blog) only link once dist/ exists.
      - name: Link workspace binaries
        run: pnpm install --frozen-lockfile --offline

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit (high+)
        run: pnpm audit --audit-level=high

      - name: Test
        run: pnpm test

      - name: Example app (smoke)
        run: pnpm example:basic

      - name: Lint docs content (blog, glossary)
        run: pnpm --filter cyphra-doc lint:content

      - name: Build docs
        run: pnpm doc:build

      # Serve the built docs and check titles, canonicals, JSON-LD, links, sitemap, feed and
      # security.txt (doc/scripts/seo-audit.ts).
      - name: SEO audit
        run: |
          pnpm --filter cyphra-doc exec next start -p 3100 > next-start.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3100/sitemap.xml && break; sleep 1; done
          pnpm --filter cyphra-doc seo:audit http://localhost:3100

  neo4j-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/cyphra_ci_test
        options: >-
          --health-cmd "cypher-shell -u neo4j -p cyphra_ci_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 60s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' run build

      - name: Neo4j integration tests
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: |
          pnpm --filter @cyphra/runtime --fail-if-no-match exec vitest run src/client.integration.test.ts src/orm/orm.integration.test.ts
          pnpm --filter @cyphra/migrator --fail-if-no-match exec vitest run src/push.integration.test.ts src/migrate.integration.test.ts
          # Better Auth conformance suites + adapter, typed-client and migration tests.
          pnpm --filter @cyphra/better-auth --fail-if-no-match exec vitest run test/
