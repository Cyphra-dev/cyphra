name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' run build

      # Bins of workspace packages (e.g. `cyphra` for examples/blog) only link once dist/ exists.
      - name: Link workspace binaries
        run: pnpm install --frozen-lockfile --offline

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit (high+)
        run: pnpm audit --audit-level=high

      - name: Test
        run: pnpm test

      - name: Example app (smoke)
        run: pnpm example:basic

      # Unit tests of examples/graphrag (its Neo4j test runs in neo4j-integration).
      - name: Example GraphRAG (unit tests)
        run: pnpm --filter cyphra-example-graphrag --fail-if-no-match test

      - name: Lint docs content (blog, glossary)
        run: pnpm --filter cyphra-doc lint:content

      - name: Build docs
        run: pnpm doc:build

      # Serve the built docs and check titles, canonicals, JSON-LD, links, sitemap, feed and
      # security.txt (doc/scripts/seo-audit.ts).
      - name: SEO audit
        run: |
          pnpm --filter cyphra-doc exec next start -p 3100 > next-start.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3100/sitemap.xml && break; sleep 1; done
          pnpm --filter cyphra-doc seo:audit http://localhost:3100

  neo4j-integration:
    name: neo4j-integration (neo4j-driver ${{ matrix.neo4j-driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported range: ^5.28.3 || ^6.0.0 (peer dependency of @cyphra/runtime and friends).
        # "5" uses the lockfile as is; "6" overrides every neo4j-driver in the workspace.
        neo4j-driver: ["5", "6"]
    services:
      neo4j:
        image: neo4j:5-community
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/cyphra_ci_test
          # @neo4j/graphql (compat/graphql reference) needs APOC: apoc.util.validate(Predicate)
          # for authorization and cardinality checks in nested mutations.
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "cypher-shell -u neo4j -p cyphra_ci_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 60s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The aliased neo4j-driver-5 / neo4j-driver-6 dev dependencies of @cyphra/runtime are not
      # affected, so the cross-major (user driver != Cyphra's driver) tests run in both legs.
      - name: Use neo4j-driver 6
        if: matrix.neo4j-driver == '6'
        run: |
          npm pkg set 'pnpm.overrides.neo4j-driver=^6.3.2'
          pnpm install --no-frozen-lockfile
          git checkout -- package.json pnpm-lock.yaml

      - name: Show resolved neo4j-driver
        run: pnpm --filter @cyphra/runtime exec node -p "'neo4j-driver ' + require('neo4j-driver/package.json').version"

      - name: Build packages
        run: pnpm -r --filter './packages/*' run build

      - name: Typecheck against the resolved driver
        if: matrix.neo4j-driver == '6'
        run: pnpm -r --filter './packages/*' run typecheck

      - name: Neo4j integration tests
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: |
          pnpm --filter @cyphra/runtime --fail-if-no-match exec vitest run src/client.integration.test.ts src/orm/orm.integration.test.ts src/driver-compat.integration.test.ts
          pnpm --filter @cyphra/migrator --fail-if-no-match exec vitest run src/push.integration.test.ts src/migrate.integration.test.ts
          # Better Auth conformance suites + adapter, typed-client and migration tests.
          pnpm --filter @cyphra/better-auth --fail-if-no-match exec vitest run test/
          # @cyphra/graphql mutations (counters, nested writes, rollback, concurrent connect),
          # adversarial authorization tests (tokens, nested reads, aggregates, rolled-back writes)
          # and @cypher / @fulltext (aggregating statements, injection attempts through arguments).
          pnpm --filter @cyphra/graphql --fail-if-no-match exec vitest run test/mutations.integration.test.ts test/auth.integration.test.ts test/cypher.integration.test.ts

      # examples/graphrag: ingest the sample documents and check hybrid retrieval and graph
      # expansion. Its `cyphra generate` needs the workspace bins, linked once dist/ exists.
      - name: Example GraphRAG (Neo4j)
        if: matrix.neo4j-driver == '5'
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: |
          pnpm install --frozen-lockfile --offline
          pnpm --filter cyphra-example-graphrag --fail-if-no-match test

      # @neo4j/graphql v7 compatibility suite: goldens must still match (compat/graphql). It does
      # not exercise Cyphra's driver handling, so it runs once.
      - name: GraphQL compatibility suite
        if: matrix.neo4j-driver == '5'
        env:
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: cyphra_ci_test
        run: pnpm --filter compat-graphql --fail-if-no-match test
