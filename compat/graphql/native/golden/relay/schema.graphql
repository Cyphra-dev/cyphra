}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  """
  Aggregates over the matching nodes (with skip / take: over that window).
  """
  articleAggregate(orderBy: [ArticleOrderBy!], skip: Int, take: Int, where: ArticleWhere): ArticleAggregate
  articleCount(where: ArticleWhere): Int
  articleFindFirst(orderBy: [ArticleOrderBy!], skip: Int, where: ArticleWhere): Article
  articleFindMany(
    """A cursor (pageInfo.endCursor): the page after it."""
    after: String

    """A cursor (pageInfo.startCursor): the page before it."""
    before: String
    orderBy: [ArticleOrderBy!]
    skip: Int
    take: Int
    where: ArticleWhere
  ): ArticleList
  articleFindUnique(where: ArticleWhereUnique!): Article

  """
  Groups of the matching nodes by the fields in by, with their aggregates.
  """
  articleGroupBy(by: ArticleGroupByInput!, having: ArticleHaving, orderBy: [ArticleGroupOrderBy!], skip: Int, take: Int, where: ArticleWhere): [ArticleGroup!]

  """
  Aggregates over the matching nodes (with skip / take: over that window).
  """
  contentAggregate(orderBy: [ContentOrderBy!], skip: Int, take: Int, where: ContentWhere): ContentAggregate
  contentCount(where: ContentWhere): Int
  contentFindFirst(orderBy: [ContentOrderBy!], skip: Int, where: ContentWhere): Content
  contentFindMany(
    """A cursor (pageInfo.endCursor): the page after it."""
    after: String

    """A cursor (pageInfo.startCursor): the page before it."""
    before: String
    orderBy: [ContentOrderBy!]
    skip: Int
    take: Int
    where: ContentWhere
  ): ContentList
  contentFindUnique(where: ContentWhereUnique!): Content

  """
  Groups of the matching nodes by the fields in by, with their aggregates.
  """
  contentGroupBy(by: ContentGroupByInput!, having: ContentHaving, orderBy: [ContentGroupOrderBy!], skip: Int, take: Int, where: ContentWhere): [ContentGroup!]

  """The node with this global id (null when there is none)."""
  node(id: ID!): Node

  """
  Aggregates over the matching nodes (with skip / take: over that window).
  """
  videoAggregate(orderBy: [VideoOrderBy!], skip: Int, take: Int, where: VideoWhere): VideoAggregate
  videoCount(where: VideoWhere): Int
  videoFindFirst(orderBy: [VideoOrderBy!], skip: Int, where: VideoWhere): Video
  videoFindMany(
    """A cursor (pageInfo.endCursor): the page after it."""
    after: String

    """A cursor (pageInfo.startCursor): the page before it."""
    before: String
    orderBy: [VideoOrderBy!]
    skip: Int
    take: Int
    where: VideoWhere
  ): VideoList
  videoFindUnique(where: VideoWhereUnique!): Video

  """
  Groups of the matching nodes by the fields in by, with their aggregates.
  """
  videoGroupBy(by: VideoGroupByInput!, having: VideoHaving, orderBy: [VideoGroupOrderBy!], skip: Int, take: Int, where: VideoWhere): [VideoGroup!]

  """
  Aggregates over the matching nodes (with skip / take: over that window).
  """
  writerAggregate(orderBy: [WriterOrderBy!], skip: Int, take: Int, where: WriterWhere): WriterAggregate
  writerCount(where: WriterWhere): Int
  writerFindFirst(orderBy: [WriterOrderBy!], skip: Int, where: WriterWhere): Writer
  writerFindMany(
    """A cursor (pageInfo.endCursor): the page after it."""
    after: String

    """A cursor (pageInfo.startCursor): the page before it."""
    before: String
    orderBy: [WriterOrderBy!]
    skip: Int
    take: Int
    where: WriterWhere
  ): WriterList
  writerFindUnique(where: WriterWhereUnique!): Writer

  """
  Groups of the matching nodes by the fields in by, with their aggregates.
  """
  writerGroupBy(by: WriterGroupByInput!, having: WriterHaving, orderBy: [WriterGroupOrderBy!], skip: Int, take: Int, where: WriterWhere): [WriterGroup!]
}

"""`insensitive` compares lower-cased values."""
enum QueryMode {
  default
  insensitive
}

enum SortOrder {
  asc
  desc
}

input StringFilter {
  contains: String
  endsWith: String
  equals: String
  gt: String
  gte: String
  in: [String!]
  lt: String
  lte: String
  mode: QueryMode
  not: String
  notIn: [String!]
  startsWith: String
}

"""
Aggregates of the field in each group; the other filters need the field in by.
