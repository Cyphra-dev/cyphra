enum Level {
  ADVANCED
  BEGINNER
}

input LevelFilter {
  equals: Level
  in: [Level!]
  not: Level
  notIn: [Level!]
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

"""A WGS-84 point (degrees, height in meters)."""
type Point {
  height: Float
  latitude: Float!
  longitude: Float!
}

input PointBBoxInput {
  lowerLeft: PointInput!
  upperRight: PointInput!
}

input PointDistanceFilter {
  from: PointInput!
  gt: Float
  gte: Float
  lt: Float
  lte: Float
}

"""Sort by distance from a point (nearest first with asc, the default)."""
input PointDistanceOrder {
  distanceFrom: PointInput!
  sort: SortOrder
}

input PointFilter {
  distance: PointDistanceFilter
  equals: PointInput
  not: PointInput
  withinBBox: PointBBoxInput
}

"""A WGS-84 point."""
input PointInput {
  height: Float
  latitude: Float!
  longitude: Float!
}

type Query {
  activityCount(where: ActivityWhere): Int
  activityFindFirst(orderBy: [ActivityOrderBy!], skip: Int, where: ActivityWhere): Activity
  activityFindMany(
    """A cursor (pageInfo.endCursor): the page after it."""
    after: String

    """A cursor (pageInfo.startCursor): the page before it."""
    before: String
    orderBy: [ActivityOrderBy!]
    skip: Int
    take: Int
    where: ActivityWhere
  ): ActivityList
  activityFindUnique(where: ActivityWhereUnique!): Activity
  authorCount(where: AuthorWhere): Int
  authorFindFirst(orderBy: [AuthorOrderBy!], skip: Int, where: AuthorWhere): Author
  authorFindMany(
    """A cursor (pageInfo.endCursor): the page after it."""
    after: String

    """A cursor (pageInfo.startCursor): the page before it."""
    before: String
    orderBy: [AuthorOrderBy!]
    skip: Int
    take: Int
    where: AuthorWhere
  ): AuthorList
  authorFindUnique(where: AuthorWhereUnique!): Author
  labCount(where: LabWhere): Int
  labFindFirst(orderBy: [LabOrderBy!], skip: Int, where: LabWhere): Lab
  labFindMany(
    """A cursor (pageInfo.endCursor): the page after it."""
    after: String

    """A cursor (pageInfo.startCursor): the page before it."""
    before: String
    orderBy: [LabOrderBy!]
    skip: Int
    take: Int
    where: LabWhere
  ): LabList
  labFindUnique(where: LabWhereUnique!): Lab
  quizCount(where: QuizWhere): Int
  quizFindFirst(orderBy: [QuizOrderBy!], skip: Int, where: QuizWhere): Quiz
  quizFindMany(
    """A cursor (pageInfo.endCursor): the page after it."""
    after: String

    """A cursor (pageInfo.startCursor): the page before it."""
    before: String
    orderBy: [QuizOrderBy!]
    skip: Int
    take: Int
    where: QuizWhere
  ): QuizList
  quizFindUnique(where: QuizWhereUnique!): Quiz
  searchableCount(where: SearchableWhere): Int
  searchableFindFirst(orderBy: [SearchableOrderBy!], skip: Int, where: SearchableWhere): Searchable
  searchableFindMany(
    """A cursor (pageInfo.endCursor): the page after it."""
    after: String

    """A cursor (pageInfo.startCursor): the page before it."""
    before: String
    orderBy: [SearchableOrderBy!]
    skip: Int
    take: Int
    where: SearchableWhere
  ): SearchableList
  trackCount(where: TrackWhere): Int
  trackFindFirst(orderBy: [TrackOrderBy!], skip: Int, where: TrackWhere): Track
  trackFindMany(
    """A cursor (pageInfo.endCursor): the page after it."""
    after: String

    """A cursor (pageInfo.startCursor): the page before it."""
    before: String
    orderBy: [TrackOrderBy!]
    skip: Int
    take: Int
    where: TrackWhere
  ): TrackList
  trackFindUnique(where: TrackWhereUnique!): Track
}

"""`insensitive` compares lower-cased values."""
enum QueryMode {
  default
  insensitive
}

