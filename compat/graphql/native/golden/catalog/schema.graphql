interface Activity {
  """
  Number of related nodes per to-many relation (only the selected ones are counted).
  """
  _count: ActivityCount!

  """
  Edge properties when this Activity is reached through a relation with a relationship model (selecting it anywhere else is an error).
  """
  _edge: Contains
  author: Author
  id: ID!
  minutes: Int
  title: String!
  tracks(orderBy: [TrackOrderBy!], skip: Int, take: Int, where: TrackWhere): [Track!]!
}

interface ActivityCount {
  tracks(where: TrackWhere): Int!
}

input ActivityCountFilter {
  equals: Int
  gt: Int
  gte: Int
  in: [Int!]
  lt: Int
  lte: Int
  not: Int
  notIn: [Int!]

  """Count only these nodes."""
  where: ActivityWhere
}

input ActivityCountWhere {
  tracks: TrackCountFilter
}

type ActivityList {
  nodes: [Activity!]!
  pageInfo: PageInfo!

  """
  Number of nodes matching where, ignoring paging. Counted only when selected.
  """
  totalCount: Int!
}

input ActivityListRelationFilter {
  """Every related node matches."""
  every: ActivityWhere

  """No related node matches."""
  none: ActivityWhere

  """At least one related node matches."""
  some: ActivityWhere
}

"""Per-implementation filters: only the listed ones are kept."""
input ActivityOnWhere {
  Lab: LabWhere
  Quiz: QuizWhere
}

"""One key per element of the orderBy list."""
input ActivityOrderBy {
  _typename: SortOrder

  """Sort by a field of the related node."""
  author: AuthorScalarOrderBy
  id: SortOrder
  minutes: SortOrder
  title: SortOrder

  """Sort by the number of related nodes."""
  tracks: TrackRelationCountOrder
}

input ActivityRelationCountOrder {
  _count: SortOrder!

  """Count only the matching nodes."""
  where: ActivityWhere
}

enum ActivityTypename {
  Lab
  Quiz
}

input ActivityTypenameFilter {
  equals: ActivityTypename
  in: [ActivityTypename!]
  not: ActivityTypename
  notIn: [ActivityTypename!]
}

input ActivityWhere {
  AND: [ActivityWhere!]
  NOT: ActivityWhere
  OR: [ActivityWhere!]

  """Filters on the number of related nodes (only the readable ones)."""
  _count: ActivityCountWhere
  _on: ActivityOnWhere
  _typename: ActivityTypenameFilter
  author: AuthorRelationFilter
  id: IDFilter
  minutes: IntFilter
  title: StringFilter
  tracks: TrackListRelationFilter
}

"""
At least one unique key (checked when the query runs), plus filters on the other fields.
"""
input ActivityWhereUnique {
  AND: [ActivityWhere!]
  NOT: ActivityWhere
  OR: [ActivityWhere!]
  author: AuthorRelationFilter
  id: ID
  minutes: IntFilter
  title: StringFilter
  tracks: TrackListRelationFilter
}

type Author {
  """
  Number of related nodes per to-many relation (only the selected ones are counted).
  """
  _count: AuthorCount!
  activities(orderBy: [ActivityOrderBy!], skip: Int, take: Int, where: ActivityWhere): [Activity!]!
  id: ID!
  joined: Date!
  name: String!
  office: Point
  reach: BigInt
}

type AuthorCount {
  activities(where: ActivityWhere): Int!
}

input AuthorCountWhere {
  activities: ActivityCountFilter
}

type AuthorList {
  nodes: [Author!]!
  pageInfo: PageInfo!

  """
  Number of nodes matching where, ignoring paging. Counted only when selected.
  """
  totalCount: Int!
}

"""One key per element of the orderBy list."""
input AuthorOrderBy {
  """Sort by the number of related nodes."""
  activities: ActivityRelationCountOrder
  id: SortOrder
  joined: SortOrder
  name: SortOrder
  office: PointDistanceOrder
  reach: SortOrder
}

input AuthorRelationFilter {
  """The related node matches (null: none)."""
  is: AuthorWhere
  isNot: AuthorWhere
}

input AuthorScalarOrderBy {
  id: SortOrder
  joined: SortOrder
  name: SortOrder
  reach: SortOrder
}

input AuthorWhere {
  AND: [AuthorWhere!]
  NOT: AuthorWhere
  OR: [AuthorWhere!]

  """Filters on the number of related nodes (only the readable ones)."""
  _count: AuthorCountWhere
  activities: ActivityListRelationFilter
  id: IDFilter
  joined: DateFilter
  name: StringFilter
  office: PointFilter
  reach: BigIntFilter
}

"""
At least one unique key (checked when the query runs), plus filters on the other fields.
"""
input AuthorWhereUnique {
  AND: [AuthorWhere!]
  NOT: AuthorWhere
  OR: [AuthorWhere!]
  activities: ActivityListRelationFilter
  id: ID
  joined: DateFilter
  name: String
  office: PointFilter
  reach: BigIntFilter
}

"""
A 64-bit integer, as a decimal string (an integer literal is accepted in queries).
"""
scalar BigInt

input BigIntFilter {
  equals: BigInt
  gt: BigInt
  gte: BigInt
  in: [BigInt!]
  lt: BigInt
  lte: BigInt
  not: BigInt
  notIn: [BigInt!]
}

type Contains {
  position: Int!
}

"""A calendar date, as a `yyyy-mm-dd` string."""
scalar Date

input DateFilter {
  equals: Date
  gt: Date
  gte: Date
  in: [Date!]
  lt: Date
  lte: Date
  not: Date
  notIn: [Date!]
}

"""An instant, as an ISO 8601 string (`2026-11-01T09:30:00.000Z`)."""
scalar DateTime

input DateTimeFilter {
  equals: DateTime
  gt: DateTime
  gte: DateTime
  in: [DateTime!]
  lt: DateTime
  lte: DateTime
  not: DateTime
  notIn: [DateTime!]
}

input IDFilter {
  contains: ID
  endsWith: ID
  equals: ID
  gt: ID
  gte: ID
  in: [ID!]
  lt: ID
  lte: ID
  mode: QueryMode
  not: ID
  notIn: [ID!]
  startsWith: ID
}

input IntFilter {
  equals: Int
  gt: Int
  gte: Int
  in: [Int!]
  lt: Int
  lte: Int
  not: Int
  notIn: [Int!]
}

