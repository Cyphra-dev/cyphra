# features: groupBy
# ordered
# having on a group key (listed in by), several keys, skip / take.
{
  postGroupBy(
    by: { fields: [status, title] }
    having: { status: { equals: PUBLISHED } }
    orderBy: [{ title: asc }]
    skip: 1
    take: 5
  ) {
    status
    title
    _count {
      _all
    }
  }
}
