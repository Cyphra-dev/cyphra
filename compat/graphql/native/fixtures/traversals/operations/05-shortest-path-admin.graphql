# features: shortestPath, auth.rules.read
# ordered
# An admin: Ada to Cy goes through Hal.
{
  toCy: personShortestPath(
    from: { id: { equals: "a" } }
    to: { id: { equals: "c" } }
    via: [follows]
    maxDepth: 3
  ) {
    nodes {
      id
    }
  }
  toDi: personShortestPath(
    from: { id: { equals: "a" } }
    to: { id: { equals: "d" } }
    via: [follows]
    maxDepth: 3
  ) {
    nodes {
      id
      name
    }
    edges {
      direction
      _edge {
        since
      }
    }
  }
}
