  count_LTE: Int @deprecated(reason: "Please use the relevant generic filter '{ count: { lte: ... } } }' instead.")
  node: TeamMembersNodeAggregationWhereInput
}

input TeamMembersConnectFieldInput {
  where: MemberConnectWhere
}

type TeamMembersConnection {
  aggregate: TeamMemberMembersAggregateSelection!
  edges: [TeamMembersRelationship!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input TeamMembersConnectionAggregateInput {
  AND: [TeamMembersConnectionAggregateInput!]
  NOT: TeamMembersConnectionAggregateInput
  OR: [TeamMembersConnectionAggregateInput!]
  count: ConnectionAggregationCountFilterInput
  node: TeamMembersNodeAggregationWhereInput
}

input TeamMembersConnectionFilters {
  """Filter Teams by aggregating results on related TeamMembersConnections"""
  aggregate: TeamMembersConnectionAggregateInput

  """
  Return Teams where all of the related TeamMembersConnections match this filter
  """
  all: TeamMembersConnectionWhere

  """
  Return Teams where none of the related TeamMembersConnections match this filter
  """
  none: TeamMembersConnectionWhere

  """
  Return Teams where one of the related TeamMembersConnections match this filter
  """
  single: TeamMembersConnectionWhere

  """
  Return Teams where some of the related TeamMembersConnections match this filter
  """
  some: TeamMembersConnectionWhere
}

input TeamMembersConnectionSort {
  node: MemberSort
}

input TeamMembersConnectionWhere {
  AND: [TeamMembersConnectionWhere!]
  NOT: TeamMembersConnectionWhere
  OR: [TeamMembersConnectionWhere!]
  node: MemberWhere
}

input TeamMembersCreateFieldInput {
