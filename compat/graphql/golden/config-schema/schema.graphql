input ConnectionAggregationCountFilterInput {
  edges: IntScalarFilters
  nodes: IntScalarFilters
}

type CountConnection {
  edges: Int!
  nodes: Int!
}

"""
Information about the number of nodes and relationships created during a create mutation
"""
type CreateInfo {
  nodesCreated: Int!
  relationshipsCreated: Int!
}

type CreateMembersMutationResponse {
  info: CreateInfo!
  members: [Member!]!
}

type CreateTeamsMutationResponse {
  info: CreateInfo!
  teams: [Team!]!
}

union Entity = Member | Team

input EntityWhere {
  Member: MemberWhere
  Team: TeamWhere
}

"""Float filters"""
input FloatScalarFilters {
  eq: Float
  gt: Float
  gte: Float
  in: [Float!]
  lt: Float
  lte: Float
}

"""ID filters"""
input IDScalarFilters {
  contains: ID
  endsWith: ID
  eq: ID
  in: [ID!]
  startsWith: ID
}

type IntAggregateSelection {
  average: Float
  max: Int
  min: Int
  sum: Int
}

"""Filters for an aggregation of an int field"""
input IntScalarAggregationFilters {
  average: FloatScalarFilters
  max: IntScalarFilters
  min: IntScalarFilters
  sum: IntScalarFilters
}

"""Int filters"""
input IntScalarFilters {
  eq: Int
  gt: Int
  gte: Int
  in: [Int!]
  lt: Int
  lte: Int
}

type Member {
  age: Int
  id: ID!
}

input MemberConnectWhere {
  node: MemberWhere!
}

input MemberCreateInput {
  age: Int
  id: ID!
}

type MemberEdge {
  cursor: String!
  node: Member!
}

input MemberRelationshipFilters {
  """Filter type where all of the related Members match this filter"""
  all: MemberWhere

  """Filter type where none of the related Members match this filter"""
  none: MemberWhere

  """Filter type where one of the related Members match this filter"""
  single: MemberWhere

  """Filter type where some of the related Members match this filter"""
  some: MemberWhere
}

"""
Fields to sort Members by. The order in which sorts are applied is not guaranteed when specifying many fields in one MemberSort object.
"""
input MemberSort {
  age: SortDirection
  id: SortDirection
}

input MemberWhere {
  AND: [MemberWhere!]
  NOT: MemberWhere
  OR: [MemberWhere!]
  age: IntScalarFilters
  age_EQ: Int @deprecated(reason: "Please use the relevant generic filter age: { eq: ... }")
  age_GT: Int @deprecated(reason: "Please use the relevant generic filter age: { gt: ... }")
  age_GTE: Int @deprecated(reason: "Please use the relevant generic filter age: { gte: ... }")
  age_IN: [Int] @deprecated(reason: "Please use the relevant generic filter age: { in: ... }")
  age_LT: Int @deprecated(reason: "Please use the relevant generic filter age: { lt: ... }")
  age_LTE: Int @deprecated(reason: "Please use the relevant generic filter age: { lte: ... }")
  id: IDScalarFilters
  id_CONTAINS: ID @deprecated(reason: "Please use the relevant generic filter id: { contains: ... }")
  id_ENDS_WITH: ID @deprecated(reason: "Please use the relevant generic filter id: { endsWith: ... }")
  id_EQ: ID @deprecated(reason: "Please use the relevant generic filter id: { eq: ... }")
  id_IN: [ID!] @deprecated(reason: "Please use the relevant generic filter id: { in: ... }")
  id_STARTS_WITH: ID @deprecated(reason: "Please use the relevant generic filter id: { startsWith: ... }")
}

type MembersConnection {
  edges: [MemberEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Mutation {
  createMembers(input: [MemberCreateInput!]!): CreateMembersMutationResponse!
  createTeams(input: [TeamCreateInput!]!): CreateTeamsMutationResponse!
}

"""Pagination information (Relay)"""
type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  entities(limit: Int, offset: Int, where: EntityWhere): [Entity!]!
  members(limit: Int, offset: Int, sort: [MemberSort!], where: MemberWhere): [Member!]!
  membersConnection(after: String, first: Int, sort: [MemberSort!], where: MemberWhere): MembersConnection!
  teams(limit: Int, offset: Int, sort: [TeamSort!], where: TeamWhere): [Team!]!
  teamsConnection(after: String, first: Int, sort: [TeamSort!], where: TeamWhere): TeamsConnection!
}

"""An enum for sorting in either ascending or descending order."""
enum SortDirection {
  """Sort by field values in ascending order."""
  ASC

  """Sort by field values in descending order."""
  DESC
}

"""String filters"""
input StringScalarFilters {
  contains: String
  endsWith: String
  eq: String
  in: [String!]
  startsWith: String
}

type Team {
  id: ID!
  members(limit: Int, offset: Int, sort: [MemberSort!], where: MemberWhere): [Member!]!
  membersConnection(after: String, first: Int, sort: [TeamMembersConnectionSort!], where: TeamMembersConnectionWhere): TeamMembersConnection!
  name: String!
}

input TeamCreateInput {
  id: ID!
  members: TeamMembersFieldInput
  name: String!
}

type TeamEdge {
  cursor: String!
  node: Team!
}

type TeamMemberMembersAggregateSelection {
  count: CountConnection!
  node: TeamMemberMembersNodeAggregateSelection
}

type TeamMemberMembersNodeAggregateSelection {
  age: IntAggregateSelection!
}

input TeamMembersAggregateInput {
  AND: [TeamMembersAggregateInput!]
  NOT: TeamMembersAggregateInput
  OR: [TeamMembersAggregateInput!]
  count: IntScalarFilters
  count_EQ: Int @deprecated(reason: "Please use the relevant generic filter '{ count: { eq: ... } } }' instead.")
  count_GT: Int @deprecated(reason: "Please use the relevant generic filter '{ count: { gt: ... } } }' instead.")
