type Author {
  name: String!
}

type AuthorAggregate {
  count: Count!
  node: AuthorAggregateNode!
}

type AuthorAggregateNode {
  name: StringAggregateSelection!
}

input AuthorCreateInput {
  name: String!
}

type AuthorDeletedEvent {
  deletedAuthor: AuthorEventPayload!
  event: EventType!
  timestamp: Float!
}

type AuthorEdge {
  cursor: String!
  node: Author!
}

type AuthorEventPayload {
  name: String!
}

"""
Fields to sort Authors by. The order in which sorts are applied is not guaranteed when specifying many fields in one AuthorSort object.
"""
input AuthorSort {
  name: SortDirection
}

input AuthorSubscriptionWhere {
  AND: [AuthorSubscriptionWhere!]
  NOT: AuthorSubscriptionWhere
  OR: [AuthorSubscriptionWhere!]
  name: StringScalarFilters
  name_CONTAINS: String @deprecated(reason: "Please use the relevant generic filter name: { contains: ... }")
  name_ENDS_WITH: String @deprecated(reason: "Please use the relevant generic filter name: { endsWith: ... }")
  name_EQ: String @deprecated(reason: "Please use the relevant generic filter name: { eq: ... }")
  name_IN: [String!] @deprecated(reason: "Please use the relevant generic filter name: { in: ... }")
  name_STARTS_WITH: String @deprecated(reason: "Please use the relevant generic filter name: { startsWith: ... }")
}

input AuthorUpdateInput {
  name: StringScalarMutations
  name_SET: String @deprecated(reason: "Please use the generic mutation 'name: { set: ... } }' instead.")
}

input AuthorWhere {
  AND: [AuthorWhere!]
  NOT: AuthorWhere
  OR: [AuthorWhere!]
  name: StringScalarFilters
  name_CONTAINS: String @deprecated(reason: "Please use the relevant generic filter name: { contains: ... }")
  name_ENDS_WITH: String @deprecated(reason: "Please use the relevant generic filter name: { endsWith: ... }")
  name_EQ: String @deprecated(reason: "Please use the relevant generic filter name: { eq: ... }")
  name_IN: [String!] @deprecated(reason: "Please use the relevant generic filter name: { in: ... }")
  name_STARTS_WITH: String @deprecated(reason: "Please use the relevant generic filter name: { startsWith: ... }")
}

type AuthorsConnection {
  aggregate: AuthorAggregate!
  edges: [AuthorEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Book {
  pages: Int
  title: String!
}

type BookAggregate {
  count: Count!
  node: BookAggregateNode!
}

type BookAggregateNode {
  pages: IntAggregateSelection!
  title: StringAggregateSelection!
}

input BookCreateInput {
  pages: Int
  title: String!
}

type BookCreatedEvent {
  createdBook: BookEventPayload!
  event: EventType!
  timestamp: Float!
}

type BookEdge {
  cursor: String!
  node: Book!
}

type BookEventPayload {
  pages: Int
  title: String!
}

"""
Fields to sort Books by. The order in which sorts are applied is not guaranteed when specifying many fields in one BookSort object.
"""
input BookSort {
  pages: SortDirection
  title: SortDirection
}

input BookSubscriptionWhere {
