type Query {
  booksConnection(first: Int, after: String, where: BookWhere, sort: [BookSort!]): BooksConnection!
  books(where: BookWhere, limit: Int, offset: Int, sort: [BookSort!]): [Book!]!
  authorsConnection(first: Int, after: String, where: AuthorWhere, sort: [AuthorSort!]): AuthorsConnection!
  authors(where: AuthorWhere, limit: Int, offset: Int, sort: [AuthorSort!]): [Author!]!
  draftsConnection(first: Int, after: String, where: DraftWhere, sort: [DraftSort!]): DraftsConnection!
  drafts(where: DraftWhere, limit: Int, offset: Int, sort: [DraftSort!]): [Draft!]!
}

type Mutation {
  createBooks(input: [BookCreateInput!]!): CreateBooksMutationResponse!
  deleteBooks(where: BookWhere): DeleteInfo!
  updateBooks(where: BookWhere, update: BookUpdateInput): UpdateBooksMutationResponse!
  createAuthors(input: [AuthorCreateInput!]!): CreateAuthorsMutationResponse!
  deleteAuthors(where: AuthorWhere): DeleteInfo!
  updateAuthors(where: AuthorWhere, update: AuthorUpdateInput): UpdateAuthorsMutationResponse!
  createDrafts(input: [DraftCreateInput!]!): CreateDraftsMutationResponse!
  deleteDrafts(where: DraftWhere): DeleteInfo!
  updateDrafts(where: DraftWhere, update: DraftUpdateInput): UpdateDraftsMutationResponse!
}

type Subscription {
  bookCreated(where: BookSubscriptionWhere): BookCreatedEvent!
  authorDeleted(where: AuthorSubscriptionWhere): AuthorDeletedEvent!
}

enum EventType {
  CREATE
  DELETE
  UPDATE
  CREATE_RELATIONSHIP
  DELETE_RELATIONSHIP
}

"""An enum for sorting in either ascending or descending order."""
enum SortDirection {
  """Sort by field values in ascending order."""
  ASC

  """Sort by field values in descending order."""
  DESC
}

type Author {
  name: String!
}

type AuthorAggregate {
  count: Count!
  node: AuthorAggregateNode!
}

type AuthorAggregateNode {
  name: StringAggregateSelection!
}

type AuthorDeletedEvent {
  event: EventType!
  timestamp: Float!
  deletedAuthor: AuthorEventPayload!
}

type AuthorEdge {
  cursor: String!
  node: Author!
}

type AuthorEventPayload {
  name: String!
}

type AuthorsConnection {
  edges: [AuthorEdge!]!
  totalCount: Int!
  pageInfo: PageInfo!
  aggregate: AuthorAggregate!
}

type Book {
  title: String!
  pages: Int
}

type BookAggregate {
  count: Count!
  node: BookAggregateNode!
}

type BookAggregateNode {
  title: StringAggregateSelection!
  pages: IntAggregateSelection!
}

type BookCreatedEvent {
  event: EventType!
  timestamp: Float!
  createdBook: BookEventPayload!
}

type BookEdge {
  cursor: String!
  node: Book!
}

type BookEventPayload {
  title: String!
  pages: Int
}

type BooksConnection {
  edges: [BookEdge!]!
  totalCount: Int!
  pageInfo: PageInfo!
  aggregate: BookAggregate!
}

type Count {
  nodes: Int!
}

type CreateAuthorsMutationResponse {
  info: CreateInfo!
  authors: [Author!]!
}

type CreateBooksMutationResponse {
  info: CreateInfo!
  books: [Book!]!
}

type CreateDraftsMutationResponse {
  info: CreateInfo!
  drafts: [Draft!]!
}

"""
Information about the number of nodes and relationships created during a create mutation
"""
type CreateInfo {
  nodesCreated: Int!
  relationshipsCreated: Int!
}

"""
Information about the number of nodes and relationships deleted during a delete mutation
"""
type DeleteInfo {
  nodesDeleted: Int!
  relationshipsDeleted: Int!
}

type Draft {
  text: String
}

type DraftAggregate {
  count: Count!
  node: DraftAggregateNode!
}

type DraftAggregateNode {
  text: StringAggregateSelection!
}

type DraftEdge {
  cursor: String!
  node: Draft!
}

type DraftsConnection {
  edges: [DraftEdge!]!
  totalCount: Int!
  pageInfo: PageInfo!
  aggregate: DraftAggregate!
}

type IntAggregateSelection {
  max: Int
  min: Int
  average: Float
  sum: Int
}

"""Pagination information (Relay)"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type StringAggregateSelection {
  shortest: String
  longest: String
}

type UpdateAuthorsMutationResponse {
  info: UpdateInfo!
  authors: [Author!]!
}

type UpdateBooksMutationResponse {
  info: UpdateInfo!
  books: [Book!]!
}

type UpdateDraftsMutationResponse {
  info: UpdateInfo!
  drafts: [Draft!]!
}

"""
Information about the number of nodes and relationships created and deleted during an update mutation
"""
type UpdateInfo {
  nodesCreated: Int!
  nodesDeleted: Int!
  relationshipsCreated: Int!
  relationshipsDeleted: Int!
}

