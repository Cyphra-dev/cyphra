input ConnectionAggregationCountFilterInput {
  edges: IntScalarFilters
  nodes: IntScalarFilters
}

type Count {
  nodes: Int!
}

type CountConnection {
  edges: Int!
  nodes: Int!
}

"""
Information about the number of nodes and relationships created during a create mutation
"""
type CreateInfo {
  nodesCreated: Int!
  relationshipsCreated: Int!
}

type CreateLabsMutationResponse {
  info: CreateInfo!
  labs: [Lab!]!
}

type CreateUsersMutationResponse {
  info: CreateInfo!
  users: [User!]!
}

"""
Information about the number of nodes and relationships deleted during a delete mutation
"""
type DeleteInfo {
  nodesDeleted: Int!
  relationshipsDeleted: Int!
}

"""Union of types without @node, resolved with __resolveType"""
union FeedItem = ProgressSummary | Viewer

"""Float filters"""
input FloatScalarFilters {
  eq: Float
  gt: Float
  gte: Float
  in: [Float!]
  lt: Float
  lte: Float
}

"""ID filters"""
input IDScalarFilters {
  contains: ID
  endsWith: ID
  eq: ID
  in: [ID!]
  startsWith: ID
}

"""ID mutations"""
input IDScalarMutations {
  set: ID
}

"""Int filters"""
input IntScalarFilters {
  eq: Int
  gt: Int
  gte: Int
  in: [Int!]
  lt: Int
  lte: Int
}

type Lab {
  authorNames: [String!]!
  authors(limit: Int, offset: Int, sort: [UserSort!], where: UserWhere): [User!]!
  authorsConnection(after: String, first: Int, sort: [LabAuthorsConnectionSort!], where: LabAuthorsConnectionWhere): LabAuthorsConnection!
  id: ID!
  level: Level!

  """Progress of the viewer (from context.jwt), computed by the application"""
  myProgress: ProgressSummary
  title: String!
  titleUpper: String!
}

type LabAggregate {
  count: Count!
  node: LabAggregateNode!
}

type LabAggregateNode {
  title: StringAggregateSelection!
}

input LabAuthorsAggregateInput {
  AND: [LabAuthorsAggregateInput!]
  NOT: LabAuthorsAggregateInput
  OR: [LabAuthorsAggregateInput!]
  count: IntScalarFilters
  count_EQ: Int @deprecated(reason: "Please use the relevant generic filter '{ count: { eq: ... } } }' instead.")
  count_GT: Int @deprecated(reason: "Please use the relevant generic filter '{ count: { gt: ... } } }' instead.")
  count_GTE: Int @deprecated(reason: "Please use the relevant generic filter '{ count: { gte: ... } } }' instead.")
  count_LT: Int @deprecated(reason: "Please use the relevant generic filter '{ count: { lt: ... } } }' instead.")
  count_LTE: Int @deprecated(reason: "Please use the relevant generic filter '{ count: { lte: ... } } }' instead.")
  node: LabAuthorsNodeAggregationWhereInput
}

input LabAuthorsConnectFieldInput {
  where: UserConnectWhere
}

type LabAuthorsConnection {
  aggregate: LabUserAuthorsAggregateSelection!
  edges: [LabAuthorsRelationship!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input LabAuthorsConnectionAggregateInput {
  AND: [LabAuthorsConnectionAggregateInput!]
  NOT: LabAuthorsConnectionAggregateInput
  OR: [LabAuthorsConnectionAggregateInput!]
  count: ConnectionAggregationCountFilterInput
  node: LabAuthorsNodeAggregationWhereInput
}

input LabAuthorsConnectionFilters {
  """Filter Labs by aggregating results on related LabAuthorsConnections"""
  aggregate: LabAuthorsConnectionAggregateInput

  """
  Return Labs where all of the related LabAuthorsConnections match this filter
  """
  all: LabAuthorsConnectionWhere

  """
  Return Labs where none of the related LabAuthorsConnections match this filter
  """
  none: LabAuthorsConnectionWhere

  """
  Return Labs where one of the related LabAuthorsConnections match this filter
  """
  single: LabAuthorsConnectionWhere

  """
  Return Labs where some of the related LabAuthorsConnections match this filter
  """
  some: LabAuthorsConnectionWhere
}

input LabAuthorsConnectionSort {
  node: UserSort
}

input LabAuthorsConnectionWhere {
  AND: [LabAuthorsConnectionWhere!]
  NOT: LabAuthorsConnectionWhere
  OR: [LabAuthorsConnectionWhere!]
  node: UserWhere
}

input LabAuthorsCreateFieldInput {
  node: UserCreateInput!
}

input LabAuthorsDeleteFieldInput {
  where: LabAuthorsConnectionWhere
}

input LabAuthorsDisconnectFieldInput {
  where: LabAuthorsConnectionWhere
}

input LabAuthorsFieldInput {
  connect: [LabAuthorsConnectFieldInput!]
  create: [LabAuthorsCreateFieldInput!]
}

input LabAuthorsNodeAggregationWhereInput {
  AND: [LabAuthorsNodeAggregationWhereInput!]
  NOT: LabAuthorsNodeAggregationWhereInput
  OR: [LabAuthorsNodeAggregationWhereInput!]
  name: StringScalarAggregationFilters
  name_AVERAGE_LENGTH_EQUAL: Float @deprecated(reason: "Please use the relevant generic filter 'name: { averageLength: { eq: ... } } }' instead.")
  name_AVERAGE_LENGTH_GT: Float @deprecated(reason: "Please use the relevant generic filter 'name: { averageLength: { gt: ... } } }' instead.")
  name_AVERAGE_LENGTH_GTE: Float @deprecated(reason: "Please use the relevant generic filter 'name: { averageLength: { gte: ... } } }' instead.")
  name_AVERAGE_LENGTH_LT: Float @deprecated(reason: "Please use the relevant generic filter 'name: { averageLength: { lt: ... } } }' instead.")
  name_AVERAGE_LENGTH_LTE: Float @deprecated(reason: "Please use the relevant generic filter 'name: { averageLength: { lte: ... } } }' instead.")
  name_LONGEST_LENGTH_EQUAL: Int @deprecated(reason: "Please use the relevant generic filter 'name: { longestLength: { eq: ... } } }' instead.")
  name_LONGEST_LENGTH_GT: Int @deprecated(reason: "Please use the relevant generic filter 'name: { longestLength: { gt: ... } } }' instead.")
  name_LONGEST_LENGTH_GTE: Int @deprecated(reason: "Please use the relevant generic filter 'name: { longestLength: { gte: ... } } }' instead.")
  name_LONGEST_LENGTH_LT: Int @deprecated(reason: "Please use the relevant generic filter 'name: { longestLength: { lt: ... } } }' instead.")
  name_LONGEST_LENGTH_LTE: Int @deprecated(reason: "Please use the relevant generic filter 'name: { longestLength: { lte: ... } } }' instead.")
  name_SHORTEST_LENGTH_EQUAL: Int @deprecated(reason: "Please use the relevant generic filter 'name: { shortestLength: { eq: ... } } }' instead.")
  name_SHORTEST_LENGTH_GT: Int @deprecated(reason: "Please use the relevant generic filter 'name: { shortestLength: { gt: ... } } }' instead.")
  name_SHORTEST_LENGTH_GTE: Int @deprecated(reason: "Please use the relevant generic filter 'name: { shortestLength: { gte: ... } } }' instead.")
  name_SHORTEST_LENGTH_LT: Int @deprecated(reason: "Please use the relevant generic filter 'name: { shortestLength: { lt: ... } } }' instead.")
  name_SHORTEST_LENGTH_LTE: Int @deprecated(reason: "Please use the relevant generic filter 'name: { shortestLength: { lte: ... } } }' instead.")
}

type LabAuthorsRelationship {
  cursor: String!
  node: User!
}

input LabAuthorsUpdateConnectionInput {
  node: UserUpdateInput
  where: LabAuthorsConnectionWhere
}

input LabAuthorsUpdateFieldInput {
  connect: [LabAuthorsConnectFieldInput!]
  create: [LabAuthorsCreateFieldInput!]
  delete: [LabAuthorsDeleteFieldInput!]
  disconnect: [LabAuthorsDisconnectFieldInput!]
  update: LabAuthorsUpdateConnectionInput
}

input LabCreateInput {
  authors: LabAuthorsFieldInput
  id: ID!
  level: Level!
  title: String!
}

input LabDeleteInput {
  authors: [LabAuthorsDeleteFieldInput!]
}

type LabEdge {
  cursor: String!
  node: Lab!
}

"""
Fields to sort Labs by. The order in which sorts are applied is not guaranteed when specifying many fields in one LabSort object.
"""
input LabSort {
  id: SortDirection
  level: SortDirection
  title: SortDirection
}

input LabUpdateInput {
  authors: [LabAuthorsUpdateFieldInput!]
  id: IDScalarMutations
  id_SET: ID @deprecated(reason: "Please use the generic mutation 'id: { set: ... } }' instead.")
  level: LevelEnumScalarMutations
  level_SET: Level @deprecated(reason: "Please use the generic mutation 'level: { set: ... } }' instead.")
  title: StringScalarMutations
  title_SET: String @deprecated(reason: "Please use the generic mutation 'title: { set: ... } }' instead.")
}

type LabUserAuthorsAggregateSelection {
  count: CountConnection!
  node: LabUserAuthorsNodeAggregateSelection
}

type LabUserAuthorsNodeAggregateSelection {
  name: StringAggregateSelection!
}

input LabWhere {
  AND: [LabWhere!]
  NOT: LabWhere
  OR: [LabWhere!]
  authors: UserRelationshipFilters
  authorsAggregate: LabAuthorsAggregateInput @deprecated(reason: "Aggregate filters are moved inside the authorsConnection filter, please use { authorsConnection: { aggregate: {...} } } instead")
  authorsConnection: LabAuthorsConnectionFilters

  """
  Return Labs where all of the related LabAuthorsConnections match this filter
  """
  authorsConnection_ALL: LabAuthorsConnectionWhere @deprecated(reason: "Please use the relevant generic filter 'authorsConnection: { all: { node: ... } } }' instead.")

  """
  Return Labs where none of the related LabAuthorsConnections match this filter
  """
  authorsConnection_NONE: LabAuthorsConnectionWhere @deprecated(reason: "Please use the relevant generic filter 'authorsConnection: { none: { node: ... } } }' instead.")

  """
  Return Labs where one of the related LabAuthorsConnections match this filter
  """
  authorsConnection_SINGLE: LabAuthorsConnectionWhere @deprecated(reason: "Please use the relevant generic filter 'authorsConnection: { single: { node: ... } } }' instead.")

  """
  Return Labs where some of the related LabAuthorsConnections match this filter
  """
  authorsConnection_SOME: LabAuthorsConnectionWhere @deprecated(reason: "Please use the relevant generic filter 'authorsConnection: { some: { node: ... } } }' instead.")

  """Return Labs where all of the related Users match this filter"""
  authors_ALL: UserWhere @deprecated(reason: "Please use the relevant generic filter 'authors: { all: ... }' instead.")

  """Return Labs where none of the related Users match this filter"""
  authors_NONE: UserWhere @deprecated(reason: "Please use the relevant generic filter 'authors: { none: ... }' instead.")

  """Return Labs where one of the related Users match this filter"""
  authors_SINGLE: UserWhere @deprecated(reason: "Please use the relevant generic filter 'authors: {  single: ... }' instead.")

  """Return Labs where some of the related Users match this filter"""
  authors_SOME: UserWhere @deprecated(reason: "Please use the relevant generic filter 'authors: {  some: ... }' instead.")
  id: IDScalarFilters
  id_CONTAINS: ID @deprecated(reason: "Please use the relevant generic filter id: { contains: ... }")
  id_ENDS_WITH: ID @deprecated(reason: "Please use the relevant generic filter id: { endsWith: ... }")
  id_EQ: ID @deprecated(reason: "Please use the relevant generic filter id: { eq: ... }")
  id_IN: [ID!] @deprecated(reason: "Please use the relevant generic filter id: { in: ... }")
  id_STARTS_WITH: ID @deprecated(reason: "Please use the relevant generic filter id: { startsWith: ... }")
  level: LevelEnumScalarFilters
  level_EQ: Level @deprecated(reason: "Please use the relevant generic filter level: { eq: ... }")
  level_IN: [Level!] @deprecated(reason: "Please use the relevant generic filter level: { in: ... }")
  title: StringScalarFilters
