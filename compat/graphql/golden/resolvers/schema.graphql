  title_ENDS_WITH: String @deprecated(reason: "Please use the relevant generic filter title: { endsWith: ... }")
  title_EQ: String @deprecated(reason: "Please use the relevant generic filter title: { eq: ... }")
  title_IN: [String!] @deprecated(reason: "Please use the relevant generic filter title: { in: ... }")
  title_STARTS_WITH: String @deprecated(reason: "Please use the relevant generic filter title: { startsWith: ... }")
}

type LabsConnection {
  aggregate: LabAggregate!
  edges: [LabEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

enum Level {
  ADVANCED
  BEGINNER
}

"""Level filters"""
input LevelEnumScalarFilters {
  eq: Level
  in: [Level!]
}

"""Level mutations"""
input LevelEnumScalarMutations {
  set: Level
}

type Mutation {
  createLabs(input: [LabCreateInput!]!): CreateLabsMutationResponse!
  createUsers(input: [UserCreateInput!]!): CreateUsersMutationResponse!
  deleteLabs(delete: LabDeleteInput, where: LabWhere): DeleteInfo!
  deleteUsers(where: UserWhere): DeleteInfo!
  recordProgress(input: ProgressInput!): ProgressRecord!
  updateLabs(update: LabUpdateInput, where: LabWhere): UpdateLabsMutationResponse!
  updateUsers(update: UserUpdateInput, where: UserWhere): UpdateUsersMutationResponse!
}

"""Pagination information (Relay)"""
type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

input ProgressInput {
  labId: ID!

  """Free text"""
  note: String
  percent: Int! = 0
}

type ProgressRecord {
  by: String
  labId: ID!
  note: String
  percent: Int!
}

"""Computed by the application, not stored"""
type ProgressSummary {
  labId: ID!
  percent: Int!
  viewer: String
}

type Query {
  adminNote: String
  feed: [FeedItem!]!
  labs(limit: Int, offset: Int, sort: [LabSort!], where: LabWhere): [Lab!]!
  labsConnection(after: String, first: Int, sort: [LabSort!], where: LabWhere): LabsConnection!

  """Counts labs through context.executionContext"""
  stats(level: Level): Stats!
  users(limit: Int, offset: Int, sort: [UserSort!], where: UserWhere): [User!]!
  usersConnection(after: String, first: Int, sort: [UserSort!], where: UserWhere): UsersConnection!
  whoAmI: Viewer
}

"""An enum for sorting in either ascending or descending order."""
enum SortDirection {
  """Sort by field values in ascending order."""
  ASC

  """Sort by field values in descending order."""
  DESC
}

type Stats {
  featured: Lab
  labCount: Int!
  level: Level
}

type StringAggregateSelection {
  longest: String
  shortest: String
}

"""Filters for an aggregation of a string field"""
input StringScalarAggregationFilters {
  averageLength: FloatScalarFilters
  longestLength: IntScalarFilters
  shortestLength: IntScalarFilters
}

"""String filters"""
input StringScalarFilters {
  contains: String
  endsWith: String
  eq: String
  in: [String!]
  startsWith: String
}

"""String mutations"""
input StringScalarMutations {
  set: String
}

"""
Information about the number of nodes and relationships created and deleted during an update mutation
"""
type UpdateInfo {
  nodesCreated: Int!
  nodesDeleted: Int!
  relationshipsCreated: Int!
  relationshipsDeleted: Int!
}

type UpdateLabsMutationResponse {
  info: UpdateInfo!
  labs: [Lab!]!
}

type UpdateUsersMutationResponse {
  info: UpdateInfo!
  users: [User!]!
}

type User {
  id: ID!
  name: String!
}

type UserAggregate {
  count: Count!
  node: UserAggregateNode!
}

type UserAggregateNode {
  name: StringAggregateSelection!
}

input UserConnectWhere {
  node: UserWhere!
}

input UserCreateInput {
  id: ID!
  name: String!
}

type UserEdge {
  cursor: String!
  node: User!
}

input UserRelationshipFilters {
  """Filter type where all of the related Users match this filter"""
  all: UserWhere

  """Filter type where none of the related Users match this filter"""
  none: UserWhere

  """Filter type where one of the related Users match this filter"""
  single: UserWhere

  """Filter type where some of the related Users match this filter"""
  some: UserWhere
}

"""
Fields to sort Users by. The order in which sorts are applied is not guaranteed when specifying many fields in one UserSort object.
"""
input UserSort {
  id: SortDirection
  name: SortDirection
}

input UserUpdateInput {
  id: IDScalarMutations
  id_SET: ID @deprecated(reason: "Please use the generic mutation 'id: { set: ... } }' instead.")
  name: StringScalarMutations
  name_SET: String @deprecated(reason: "Please use the generic mutation 'name: { set: ... } }' instead.")
}

input UserWhere {
  AND: [UserWhere!]
  NOT: UserWhere
  OR: [UserWhere!]
  id: IDScalarFilters
  id_CONTAINS: ID @deprecated(reason: "Please use the relevant generic filter id: { contains: ... }")
  id_ENDS_WITH: ID @deprecated(reason: "Please use the relevant generic filter id: { endsWith: ... }")
  id_EQ: ID @deprecated(reason: "Please use the relevant generic filter id: { eq: ... }")
  id_IN: [ID!] @deprecated(reason: "Please use the relevant generic filter id: { in: ... }")
  id_STARTS_WITH: ID @deprecated(reason: "Please use the relevant generic filter id: { startsWith: ... }")
  name: StringScalarFilters
  name_CONTAINS: String @deprecated(reason: "Please use the relevant generic filter name: { contains: ... }")
  name_ENDS_WITH: String @deprecated(reason: "Please use the relevant generic filter name: { endsWith: ... }")
  name_EQ: String @deprecated(reason: "Please use the relevant generic filter name: { eq: ... }")
  name_IN: [String!] @deprecated(reason: "Please use the relevant generic filter name: { in: ... }")
  name_STARTS_WITH: String @deprecated(reason: "Please use the relevant generic filter name: { startsWith: ... }")
}

type UsersConnection {
  aggregate: UserAggregate!
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Viewer {
  roles: [String!]!
  sub: String
}
