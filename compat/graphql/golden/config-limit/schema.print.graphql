type Query {
  shelves(where: ShelfWhere, limit: Int, offset: Int): [Shelf!]!
  authorsConnection(first: Int, after: String, where: AuthorWhere, sort: [AuthorSort!]): AuthorsConnection!
  authors(where: AuthorWhere, limit: Int, offset: Int, sort: [AuthorSort!]): [Author!]!
  volumesByTitle(phrase: String!, where: VolumeIndexWhere, sort: [VolumeIndexSort!], first: Int, after: String): VolumesIndexConnection!
  volumesConnection(first: Int, after: String, where: VolumeWhere, sort: [VolumeSort!]): VolumesConnection!
  volumes(where: VolumeWhere, limit: Int, offset: Int, sort: [VolumeSort!]): [Volume!]!
  notesConnection(first: Int, after: String, where: NoteWhere, sort: [NoteSort!]): NotesConnection!
  notes(where: NoteWhere, limit: Int, offset: Int, sort: [NoteSort!]): [Note!]!
  tagsConnection(first: Int, after: String, where: TagWhere, sort: [TagSort!]): TagsConnection!
  tags(where: TagWhere, limit: Int, offset: Int, sort: [TagSort!]): [Tag!]!
  allVolumes: [Volume!]!
}

type Mutation {
  createAuthors(input: [AuthorCreateInput!]!): CreateAuthorsMutationResponse!
  deleteAuthors(where: AuthorWhere, delete: AuthorDeleteInput): DeleteInfo!
  updateAuthors(where: AuthorWhere, update: AuthorUpdateInput): UpdateAuthorsMutationResponse!
  createVolumes(input: [VolumeCreateInput!]!): CreateVolumesMutationResponse!
  deleteVolumes(where: VolumeWhere): DeleteInfo!
  updateVolumes(where: VolumeWhere, update: VolumeUpdateInput): UpdateVolumesMutationResponse!
  createNotes(input: [NoteCreateInput!]!): CreateNotesMutationResponse!
  deleteNotes(where: NoteWhere): DeleteInfo!
  updateNotes(where: NoteWhere, update: NoteUpdateInput): UpdateNotesMutationResponse!
  createTags(input: [TagCreateInput!]!): CreateTagsMutationResponse!
  deleteTags(where: TagWhere): DeleteInfo!
  updateTags(where: TagWhere, update: TagUpdateInput): UpdateTagsMutationResponse!
}

"""An enum for sorting in either ascending or descending order."""
enum SortDirection {
  """Sort by field values in ascending order."""
  ASC

  """Sort by field values in descending order."""
  DESC
}

