type Query {
  contents(where: ContentWhere, limit: Int, offset: Int): [Content!]!
  usersConnection(first: Int, after: String, where: UserWhere, sort: [UserSort!]): UsersConnection!
  users(where: UserWhere, limit: Int, offset: Int, sort: [UserSort!]): [User!]!
  moviesConnection(first: Int, after: String, where: MovieWhere, sort: [MovieSort!]): MoviesConnection!
  movies(where: MovieWhere, limit: Int, offset: Int, sort: [MovieSort!]): [Movie!]!
  booksConnection(first: Int, after: String, where: BookWhere, sort: [BookSort!]): BooksConnection!
  books(where: BookWhere, limit: Int, offset: Int, sort: [BookSort!]): [Book!]!
  genresConnection(first: Int, after: String, where: GenreWhere, sort: [GenreSort!]): GenresConnection!
  genres(where: GenreWhere, limit: Int, offset: Int, sort: [GenreSort!]): [Genre!]!
}

type Mutation {
  createUsers(input: [UserCreateInput!]!): CreateUsersMutationResponse!
  deleteUsers(where: UserWhere, delete: UserDeleteInput): DeleteInfo!
  updateUsers(where: UserWhere, update: UserUpdateInput): UpdateUsersMutationResponse!
  createMovies(input: [MovieCreateInput!]!): CreateMoviesMutationResponse!
  deleteMovies(where: MovieWhere, delete: MovieDeleteInput): DeleteInfo!
  updateMovies(where: MovieWhere, update: MovieUpdateInput): UpdateMoviesMutationResponse!
  createBooks(input: [BookCreateInput!]!): CreateBooksMutationResponse!
  deleteBooks(where: BookWhere): DeleteInfo!
  updateBooks(where: BookWhere, update: BookUpdateInput): UpdateBooksMutationResponse!
  createGenres(input: [GenreCreateInput!]!): CreateGenresMutationResponse!
  deleteGenres(where: GenreWhere): DeleteInfo!
  updateGenres(where: GenreWhere, update: GenreUpdateInput): UpdateGenresMutationResponse!
}

"""An enum for sorting in either ascending or descending order."""
enum SortDirection {
  """Sort by field values in ascending order."""
  ASC

  """Sort by field values in descending order."""
  DESC
}

