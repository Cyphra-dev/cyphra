# features: filter.relationship, filter.connection, filter.edge, filter.boolean, filter.datetime
query {
  followedByDev: accounts(where: { followers: { some: { handle: { eq: "dev" } } } }) {
    handle
  }
  followsOnlyOne: accounts(where: { follows: { single: {} } }) {
    handle
  }
  followsNobody: accounts(where: { follows: { none: {} } }) {
    handle
  }
  allFollowersJoinedBefore2023: accounts(
    where: { followers: { some: {}, all: { joined: { lt: "2023-01-01T00:00:00Z" } } } }
  ) {
    handle
  }
  hasMutedSomeone: accounts(
    where: { followsConnection: { some: { edge: { muted: { eq: true } } } } }
  ) {
    handle
  }
  followedSince2022: accounts(
    where: { followersConnection: { some: { edge: { since: { gte: "2022-01-01T00:00:00Z" } } } } }
  ) {
    handle
  }
  likedByFollowersOfAna: statuses(
    where: { likedBy: { some: { follows: { some: { handle: { eq: "ana" } } } } } }
  ) {
    id
  }
  textSearch: statuses(
    where: { OR: [{ text: { contains: "graph" } }, { text: { startsWith: "cypher" } }] }
  ) {
    id
  }
}
