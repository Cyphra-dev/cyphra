# features: relationship.to-one, union, mutation.create, errors
mutation {
  createUsers(
    input: [
      {
        id: "u9"
        name: "Eve"
        pinned: {
          Profile: { create: { node: { id: "p9", bio: "Pinned" } } }
          Lab: { create: { node: { id: "lab-9", name: "P", state: "DRAFT" } } }
        }
      }
    ]
  ) {
    users {
      id
    }
  }
}
